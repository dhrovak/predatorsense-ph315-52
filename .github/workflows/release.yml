name: Releaser

on:
  pull_request:
    types: [closed]
    branches:
      - main
      
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predatorsense-release
  cancel-in-progress: false

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+$' \
            | head -n 1 || true)

          if [[ -z "$latest_tag" ]]; then
            major=1
            minor=0
          else
            IFS='.' read -r major minor <<< "${latest_tag#v}"

            minor=$((minor + 1))

            if (( minor > 9 )); then
              major=$((major + 1))
              minor=0
            fi
          fi

          version="${major}.${minor}"

          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "name=PredatorSense v${version}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          generateReleaseNotes: true
          artifacts: "dist/*"
